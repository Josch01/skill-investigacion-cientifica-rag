name: Validate scientific skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill architecture
        run: python scripts/validate_skill.py
      - name: Validate empty consortium blackboard template
        run: python scripts/validate_research_state.py templates/BLACKBOARD_STATE.json

      - name: Validate empty lifecycle project
        run: python scripts/validate_research_lifecycle.py templates/RESEARCH_GRAPH.json
      - name: Run lifecycle regression tests
        run: python -m unittest discover -s tests -v
